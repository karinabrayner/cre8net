<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cre8Net - Publicar Arte</title>

    <link rel="stylesheet" href="Cadastro.css">

    <style>

        /* ==========================
           ÁREA DE UPLOAD
        ========================== */

        .upload-area {
            margin-top: 15px;
        }

        .upload-area input[type="file"] {
            border: 2px dashed rgb(230, 179, 85);

            background-color: rgb(250, 247, 240);

            padding: 20px;

            width: 100%;

            cursor: pointer;

            transition: .3s;
        }

        .upload-area input[type="file"]:hover {
            border-color: rgb(150, 180, 219);

            background-color: rgb(245, 248, 252);
        }


        /* ==========================
           TEXTAREA
        ========================== */

        textarea {
            width: 100%;

            padding: 12px;

            border: 2px solid rgb(230, 179, 85);

            border-radius: 8px;

            font-size: 15px;

            resize: vertical;

            min-height: 100px;

            font-family:
                'Gill Sans',
                'Gill Sans MT',
                Calibri,
                'Trebuchet MS',
                sans-serif;

            transition: .3s;
        }

        textarea:focus {
            outline: none;

            border-color: rgb(150, 180, 219);

            box-shadow:
                0 0 8px rgba(150, 180, 219, .4);
        }


        /* ==========================
           PREVIEW
        ========================== */

        #preview {
            margin-top: 15px;

            display: none;

            text-align: center;
        }

        #preview img {
            width: 100%;

            max-height: 350px;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, .15);
        }


        /* ==========================
           MENSAGEM
        ========================== */

        #mensagem {
            text-align: center;

            margin-top: 15px;

            font-weight: bold;

            min-height: 20px;
        }


        /* ==========================
           BOTÃO VOLTAR
        ========================== */

        .voltar {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: rgb(150, 180, 219);

            text-decoration: none;

            font-weight: bold;
        }

        .voltar:hover {
            text-decoration: underline;
        }


        /* ==========================
           RESPONSIVO
        ========================== */

        @media(max-width: 600px) {

            .formulario {
                margin: 20px;

                padding: 25px;
            }

        }

    </style>

</head>


<body>


    <!-- ==========================
         MENU
    ========================== -->

    <nav>

        <ul class="Lista-de-links">

            <li>
                <a href="Home.html">
                    Home
                </a>
            </li>

            <li>
                <a href="GaleriaGeral.html">
                    Galeria
                </a>
            </li>

            <li>
                <a href="GaleriaPessoal.html">
                    Minha Galeria
                </a>
            </li>

            <li>
                <a href="PerfilPessoal.html">
                    Meu Perfil
                </a>
            </li>

            <li>
                <a href="Login.html">
                    Log-in
                </a>
            </li>

        </ul>

    </nav>


    <!-- ==========================
         CONTEÚDO
    ========================== -->

    <main class="container">

        <div class="formulario">


            <h1>
                Publicar Arte
            </h1>


            <form
                id="arteForm"
                action="publicar.php"
                method="POST"
                enctype="multipart/form-data"
            >


                <!-- TÍTULO -->

                <label for="titulo">
                    Título da Arte
                </label>

                <input
                    type="text"
                    id="titulo"
                    name="titulo"
                    placeholder="Dê um nome para sua arte"
                    maxlength="100"
                    required
                >


                <!-- DESCRIÇÃO -->

                <label for="descricao">
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    name="descricao"
                    placeholder="Conte um pouco sobre sua arte..."
                    maxlength="1000"
                ></textarea>


                <!-- IMAGEM -->

                <label for="imagem">
                    Escolha sua Arte
                </label>


                <div class="upload-area">

                    <input
                        type="file"
                        id="imagem"
                        name="imagem"
                        accept="image/jpeg,image/png,image/gif,image/webp"
                        required
                    >

                </div>


                <!-- PREVIEW -->

                <div id="preview">

                    <img
                        id="previewImagem"
                        src=""
                        alt="Pré-visualização da arte"
                    >

                </div>


                <!-- BOTÃO -->

                <button type="submit">

                    Publicar Arte

                </button>


                <!-- MENSAGEM -->

                <p id="mensagem"></p>


                <!-- VOLTAR -->

                <a
                    href="GaleriaGeral.html"
                    class="voltar"
                >
                    ← Voltar para a galeria
                </a>


            </form>

        </div>

    </
